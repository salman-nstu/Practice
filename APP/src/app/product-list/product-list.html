<section>
  <h2>User Info</h2>
  <p>Name: {{ user.name }}</p>
  <p>Email: {{ user.email }}</p>
  <p>Age: {{ user.age }}</p>
</section>

<section>
  <h2>Products</h2>

  <div *ngFor="let product of products">
    <h3>{{ product.name }}</h3>
    <p>Price: ${{ product.price }}</p>
    <p>Status: {{ product.inStock ? 'In Stock' : 'Out of Stock' }}</p>
    <hr>
  </div>
</section>
