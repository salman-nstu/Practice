<div class="profile-card">
    <img [src]="avatarUrl" [alt]="username + ' avatar'" [style.width.px]="avatarSize" [style.height.px]="avatarSize"
        class="avatar">

    <h2 [class.inactive]="isInactive">
        {{ username }}
    </h2>

    <p>{{ email }}</p>

    <p [hidden]="!isVerified">
        Verified account
    </p>

    <p [attr.aria-label]="'Account status'">
        Status: {{ isInactive ? 'Inactive' : 'Active' }}
    </p>

    <button [disabled]="saveDisabled" (click)="saveProfile()">
        {{ isSaving ? 'Saving...' : 'Save' }}
    </button>

    <button (click)="toggleStatus()">
        Toggle status
    </button>
    <!-- 
    <button (click)="showEvent($event)">
        Click Me
    </button> -->



    <div>

        <input type="checkbox" (change)="handleCheckbox($event)">

        <br>



        <input type="text" placeholder="Type" [disabled]="!isTextboxEnabled">


    </div>



    <p>Count: {{ count }}</p>

    <button (click)="increment()">+</button>

    <button (click)="decrement()">-</button>

    <button (click)="reset()">Reset</button>

    <input placeholder="Type Something " [(ngModel)]="username">


    <!-- <input [ngModel]="name" (ngModelChange)="name = $event"> -->

    <p>Hello, {{ username }}</p>


    <textarea [(ngModel)]="bio"></textarea>

    <p>Bio: {{ bio }}</p>


    <label>
        <input type="checkbox" [(ngModel)]="isInactive">
        I am a student
    </label>

    <p>Student: {{ isInactive }}</p>



    <select [(ngModel)]="role">
        <option value="Student">Student</option>
        <option value="Teacher">Teacher</option>
        <option value="Developer">Developer</option>
    </select>

    <p>Selected role: {{ role }}</p>

    @if (isVerified) {
    <p>Profile is Verified</p>
    }

</div>
