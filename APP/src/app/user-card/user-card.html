<div class="user-card">

  <div class="user-info">
    <h3>{{ user.name }}</h3>
    <p class="email">{{ user.email }}</p>
    <span class="role-badge">{{ user.role }}</span>
  </div>

  <div class="card-actions">
    <button type="button" class="btn-select" (click)="selectUser()">
      Select
    </button>
    <button type="button" class="btn-delete" (click)="deleteUser()">
      Delete
    </button>
  </div>

</div>
