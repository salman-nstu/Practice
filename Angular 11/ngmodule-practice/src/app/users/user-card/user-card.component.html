<article class="user-card">
  <div class="card-header">
    <h3>{{ user.name }}</h3>
    <app-badge
      [text]="user.active ? 'Active' : 'Inactive'"
      [active]="user.active">
    </app-badge>
  </div>

  <p class="email">{{ user.email }}</p>
  <p><strong>Role:</strong> {{ user.role }}</p>

  <button type="button" (click)="selectUser()" [attr.aria-label]="'Select ' + user.name">
    Select user
  </button>
</article>
