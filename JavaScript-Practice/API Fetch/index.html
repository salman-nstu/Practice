<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="navbar-content">
            <button id="home-nav">Home</button>
            <button id="cart-nav">
                Cart <span id="nav-cart-count">0</span>
            </button>
            <!-- <button id="search-nav">Search</button> -->
        </div>
    </nav>

    <div class="page-layout">

        <main class="main-content">

            <div id="product-list-view">

                <header class="page-header">
                    <h1>Products</h1>

                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Search products...">
                    </div>
                </header>

                <div id="product-container"></div>

            </div>


            <div id="product-detail-view" class="hidden">

                <button id="back-btn">&larr; Back to Products</button>

                <div id="product-detail-content"></div>

            </div>


            <div id="cart-view" class="hidden">

                <h1>Cart</h1>

                <div id="cart-container"></div>

                <button id="confirm-order-btn">
                    Confirm Order
                </button>

            </div>

        </main>
        <div id="pagination"></div>

    </div>



    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script> -->
    <script src="script.js"></script>
    <script src="order.js"></script>
</body>

</html>
