<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Todo List</h1>

        <form id="todoForm">

            <input id="todoInput" type="text" placeholder="Enter a task" required minlength="3">

            <button type="submit">
                Add Task
            </button>

        </form>

        <ul id="taskList"></ul>

    </main>

    <script src="script.js"></script>
    <!-- <script type="module" src="./main.js"></script> -->

</body>

</html>
